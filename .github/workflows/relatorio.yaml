name: Pipeline Targets e Relatório
on:
  push:
    branches: [ main, trabalho ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Configurar R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Restaurar ambiente renv
        uses: r-lib/actions/setup-renv@v2

      - name: Executar pipeline targets
        shell: Rscript {0}
        run: |
          targets::tar_make()